name: Daily Scan & Deploy to GitHub Pages

on:
  schedule:
    # Runs at 10:30 PM ET Monday–Friday (2:30 AM UTC Tue–Sat)
    # Adjust if you need pre-market or different timezone
    - cron: '30 2 * * 2-6'
  workflow_dispatch: # allow manual trigger from GitHub UI

permissions:
  contents: write       # needed to commit results JSON
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run momentum scanner
        run: node momentum_setups.mjs

      - name: Copy results JSON into web/
        run: |
          DATE=$(date +%Y-%m-%d)
          cp "momentum_results_${DATE}.json" "web/momentum_results_${DATE}.json"
          # Also write web/latest.json so the site always has a fallback
          cp "momentum_results_${DATE}.json" "web/latest.json"

      - name: Fetch per-symbol OHLC data
        run: node fetch_yahoo.mjs

      - name: Commit results back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/latest.json "web/momentum_results_*.json" web/data/
          git diff --cached --quiet || git commit -m "chore: update scan results $(date +%Y-%m-%d)"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
